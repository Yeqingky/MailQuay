name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mailquay
          POSTGRES_PASSWORD: mailquay
          POSTGRES_DB: mailquay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailquay -d mailquay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILQUAY_TEST_DATABASE_URL: postgres://mailquay:mailquay@127.0.0.1:5432/mailquay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test -race ./...
      - name: integration tests
        run: go test -tags=integration ./test/integration/...
      - name: build api
        run: make build
      - name: generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
          make generate
          git diff --exit-code
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: build frontend
        run: |
          cd frontend
          timeout 900 corepack pnpm install --frozen-lockfile
          timeout 600 corepack pnpm build
          mkdir -p "$GITHUB_WORKSPACE/internal/webassets"
          rm -rf "$GITHUB_WORKSPACE/internal/webassets/dist"
          cp -R dist "$GITHUB_WORKSPACE/internal/webassets/dist"
      - name: build embedded binary
        run: make build-full
